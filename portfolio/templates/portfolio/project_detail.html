{% extends 'portfolio/base.html' %}

{% block title %}{{ project.title }}{% endblock %}

{% block content %}

  <a href="/" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>

  

  <h1>{{ project.title }}</h1>
  <p>{{ project.description }}</p>
  <a href="{{ project.github_url }}" target="_blank" class="btn btn-dark">View on GitHub</a>

  {% if project.image %}
  <div style="margin-bottom:3rem; margin-top:2rem;">
    <img src="{{ project.image.url }}"
         alt="{{ project.title }}"
         style="width:100%; max-width:860px; border-radius:12px; order:1px solid #1e1e1e; object-fit:cover; display:block;"
    >
  </div>
{% endif %}

{% endblock %}
