{% extends 'portfolio/base.html' %}
{% block title %}Contact{% endblock %}

{% block content %}
<section style="max-width: 520px; margin: 4rem auto;">
    <p class="section-title">Contact</p>
    <h2 style="color:#fff; font-weight:700; margin-bottom:0.5rem;">Get in touch</h2>
    <p style="color:#666; margin-bottom:2rem;">
        Fill out the form below and I'll get back to you as soon as possible.
    </p>

    <form method="POST">
        {% csrf_token %}

        <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">

    <input type="hidden" name="access_key" value="64604f77-86fd-41ed-a88c-70a27033a26b">
    <input type="hidden"
           name="redirect"
           value="https://rikhilkakani.online/contact-success/">

    <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
    </div>

    <button type="submit" class="contact-btn">
        Send Message
    </button>

</form>
    </form> 
</section>
{% endblock %}
